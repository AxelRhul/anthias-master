services:
  nextjs-standalone:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-standalone-image
    container_name: nextjs-standalone-container
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "file:/app/data/prod.db"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  nginx:
    build:
      context: ./docker/nginx
    image: anthias-nginx-image
    container_name: anthias-nginx
    ports:
      - "3000:3000"
    environment:
      TLS_HOST: ${TLS_HOST:-localhost}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - nextjs-standalone
    restart: unless-stopped

volumes:
  sqlite_data:
  nginx_certs:
